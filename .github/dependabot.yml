version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      gh-actions:
        update-types:
          - "minor"
          - "patch"
          - "major"

  - package-ecosystem: npm
    directory: "/"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      time: "10:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      prefix-development: chore
    groups:
      nx:
        patterns:
          - "nx"
          - "@nx/*"
      storybook:
        patterns:
          - "@storybook/*"
          - "*storybook*"
      versioning:
        patterns:
          - "@commitlint/*"
          - "@jscutlery/semver"
          - "conventional-changelog-*"
      jest:
        patterns:
          - "jest"
          - "*jest*"
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # yup v1 introduced breaking changes; workspace packages are pinned to ^0.32.x
      - dependency-name: yup
        update-types:
          - "version-update:semver-major"
