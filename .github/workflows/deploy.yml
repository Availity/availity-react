# This workflow will do a clean install of node dependencies, build the source code, and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Publish Release

on:
  push:
    branches: [master]

jobs:
  setup:
    if: "${{!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'Release: Version Updates')}}"
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    permissions:
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: 'master'

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: 'master'

      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Restore Nx Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Packages
        run: yarn build:components

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-dist
          path: packages/*/dist
          retention-days: 1

      - name: Lint Source Code
        run: yarn lint

      - name: Unit Tests
        run: yarn test:ci

  publish:
    if: "${{!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'Release: Version Updates')}}"
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    permissions:
      contents: write # Required for git push and creating tags
      pull-requests: write # Required for creating pull requests
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: 'master'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: 'master'

      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Restore Nx Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Download Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-dist
          path: packages

      - name: Setup Publish Config
        run: |
          git config user.email ${{ secrets.GH_EMAIL }}
          git config user.name ${{ secrets.GH_USER }}

      - name: Store initial commit SHA
        id: initial-sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Version Packages
        run: |
          yarn nx affected --target version --parallel=1

      - name: Check for Version Changes
        id: changes
        run: |
          INITIAL_SHA="${{ steps.initial-sha.outputs.sha }}"
          CURRENT_SHA=$(git rev-parse HEAD)
          if [ "$INITIAL_SHA" = "$CURRENT_SHA" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new commits created by version step"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "New commits created by version step"
          fi

      - name: Publish
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        run: |
          yarn nx affected --target publish --parallel=1

      - name: Create Release PR
        if: ${{ steps.changes.outputs.has_changes == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating PR because changes detected: ${{ steps.changes.outputs.has_changes }}"
          git push origin --delete release/version-updates || true
          git checkout -b release/version-updates
          git push origin release/version-updates
          git push origin --tags
          gh pr create --title "Release: Version Updates" --body "Automated release PR with version updates and package publications." --base master --head release/version-updates

  deploy-docs:
    if: "${{!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'Release: Version Updates')}}"
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: 'master'

      - name: Set Node Version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Download Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-dist
          path: packages

      - name: Build Docs
        run: yarn deploy:ci

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docusaurus/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
